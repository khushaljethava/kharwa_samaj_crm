<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>શ્રી ખારવા સમાજ માંડવી-કચ્છ | Shri Kharva Samaj Mandvi</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1e90ff; /* Dodger Blue - vibrant yet professional */
            --secondary: #ff6347; /* Tomato - complementary */
            --accent: #9370db; /* Medium Purple - for depth */
            --dark: #0f0f0f; /* Very dark background */
            --light: #f0f0f0; /* Off-white for text/elements */
            --gradient-main: linear-gradient(135deg, #1e90ff 0%, #9370db 100%);
            --gradient-text: linear-gradient(90deg, #1e90ff, #ff6347, #9370db);
            --card-bg: rgba(30, 30, 30, 0.7); /* Slightly lighter card background with transparency */
            --border-color: rgba(240, 240, 240, 0.1); /* Subtle borders */
        }

        body {
            font-family: 'Noto Sans Gujarati', sans-serif; /* Prefer Gujarati font */
            overflow-x: hidden;
            background-color: var(--dark);
            color: var(--light);
            line-height: 1.6;
        }

        h1, h2, h3, h4 {
            font-family: 'Poppins', sans-serif; /* Use Poppins for headings */
            font-weight: 700;
        }

        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Loading Animation */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--gradient-main);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .loader.hidden {
            opacity: 0;
            visibility: hidden;
        }


        .loader-text {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(90deg, #fff, #ffdb58); /* Brighter gold for loader text */
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1rem 5%;
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(8px);
            z-index: 1000;
            transition: all 0.4s ease-in-out;
            border-bottom: 1px solid transparent;
        }

        nav.scrolled {
            padding: 0.7rem 5%;
            box-shadow: 0 5px 25px rgba(0,0,0,0.6);
            border-bottom-color: var(--border-color);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.6rem; /* Slightly smaller logo */
            font-weight: 700;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px; /* Reduced gap */
        }

        .anchor-icon {
            width: 35px; /* Slightly smaller icon */
            height: 35px;
            background: var(--gradient-main);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem; /* Adjusted icon size */
            animation: float 4s ease-in-out infinite;
            box-shadow: 0 2px 10px rgba(30, 144, 255, 0.3);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .nav-links {
            display: flex;
            gap: 1.8rem; /* Reduced gap */
            list-style: none;
        }

        .nav-links a {
            color: var(--light);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease, transform 0.2s ease;
            position: relative;
            padding-bottom: 5px; /* Space for underline */
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gradient-text);
            transition: width 0.3s ease-in-out;
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

         .nav-links a:hover {
             color: rgba(240, 240, 240, 0.8);
             transform: translateY(-2px);
         }

        .menu-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
            padding: 5px; /* Add padding for easier clicking */
        }

        .menu-toggle span {
            width: 25px;
            height: 3px;
            background: var(--light);
            margin: 3px 0;
            transition: 0.3s ease-in-out;
            border-radius: 2px;
        }

        .menu-toggle.open span:nth-child(1) {
            transform: rotate(-45deg) translate(-5px, 6px);
        }

        .menu-toggle.open span:nth-child(2) {
            opacity: 0;
        }

        .menu-toggle.open span:nth-child(3) {
            transform: rotate(45deg) translate(-5px, -6px);
        }


        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: linear-gradient(180deg, var(--dark) 0%, #1a1a2e 100%); /* Deeper vertical gradient */
            overflow: hidden;
            padding-top: 80px; /* Space for fixed nav */
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,%3Csvg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="%23ffffff" fill-opacity="0.05" fill-rule="evenodd"%3E%3Cpath d="M0 40L40 0H20L0 20V40zm10 0L40 10V0h-10L0 30v10zm10 0L40 20V0h-10L10 30v10zm10 0L40 30V0h-10L20 30v10zm10 0L40 40V0h-10L30 30v10z"/%3E%3C/g%3E%3C/svg%3E') repeat; /* Subtle diagonal lines pattern */
            z-index: 0;
        }


        .hero-content {
            text-align: center;
            z-index: 1;
            padding: 2rem;
            max-width: 1000px; /* Slightly narrower max-width */
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s ease-out 0.8s forwards; /* Added animation */
        }

        .hero h1 {
            font-size: clamp(2.5rem, 5.5vw, 4.5rem); /* Slightly larger heading */
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #ffdb58, var(--primary), var(--secondary)); /* Adjusted gradient */
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
             line-height: 1.2;
        }

        .hero .tagline {
            font-size: clamp(1.3rem, 3vw, 2rem); /* Slightly larger tagline */
            color: var(--light);
            margin-bottom: 1.5rem; /* Reduced margin */
            opacity: 0;
            animation: fadeInUp 1s ease-out 1s forwards;
            font-weight: 500;
        }

        .hero .welcome {
            font-size: clamp(1.1rem, 2vw, 1.4rem); /* Slightly larger welcome text */
            color: #ccc; /* Slightly lighter color */
            margin-bottom: 2.5rem; /* Reduced margin */
            opacity: 0;
            animation: fadeInUp 1s ease-out 1.2s forwards;
        }


        @keyframes fadeInUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
            from {
                transform: translateY(30px);
                opacity: 0;
            }
        }

        .cta-buttons {
            display: flex;
            gap: 1.5rem; /* Reduced gap */
            justify-content: center;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeInUp 1s ease-out 1.4s forwards;
        }

        .btn {
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            border: none;
            border-radius: 30px; /* More rounded */
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.5s ease, height 0.5s ease;
            z-index: -1;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }


        .btn-primary {
            background: var(--gradient-main);
            color: white;
            box-shadow: 0 5px 15px rgba(30, 144, 255, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            box-shadow: none;
        }

        .btn-secondary:hover {
             background: var(--primary);
             color: var(--dark);
             box-shadow: 0 5px 15px rgba(30, 144, 255, 0.4);
         }


        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(30, 144, 255, 0.5);
        }


        /* Values Section */
        .values {
            padding: 5rem 5%;
            background: var(--dark);
            position: relative;
        }

        .values::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,%3Csvg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="%23ffffff" fill-opacity="0.03" fill-rule="evenodd"%3E%3Cpath d="M0 40L40 0H20L0 20V40zm10 0L40 10V0h-10L0 30v10zm10 0L40 20V0h-10L10 30v10zm10 0L40 30V0h-10L20 30v10zm10 0L40 40V0h-10L30 30v10z"/%3E%3C/g%3E%3C/svg%3E') repeat;
            z-index: 0;
        }


        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .section-title {
            text-align: center;
            font-size: clamp(2rem, 4vw, 3.5rem); /* Slightly larger */
            margin-bottom: 3rem;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .values-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); /* Adjusted minmax */
            gap: 2rem;
        }

        .value-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 15px; /* Slightly less rounded */
            padding: 2rem;
            text-align: center;
            transition: all 0.4s ease-in-out;
            border: 1px solid var(--border-color);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

         .value-card::before {
             content: '';
             position: absolute;
             top: -50%;
             left: -50%;
             width: 200%;
             height: 200%;
             background: radial-gradient(circle, rgba(30, 144, 255, 0.1) 0%, transparent 60%);
             animation: rotate 15s linear infinite;
             opacity: 0;
             transition: opacity 0.5s ease;
         }

         .value-card:hover::before {
             opacity: 1;
         }


        .value-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 40px rgba(30, 144, 255, 0.3);
            border-color: var(--primary);
        }

        .value-icon {
            width: 70px; /* Slightly smaller icon */
            height: 70px;
            margin: 0 auto 1.5rem;
            background: var(--gradient-main);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem; /* Adjusted font size */
            box-shadow: 0 5px 15px rgba(30, 144, 255, 0.3);
            transition: transform 0.3s ease;
        }

        .value-card:hover .value-icon {
            transform: rotate(10deg) scale(1.1);
        }

        .value-card h3 {
            font-size: 1.4rem; /* Slightly smaller heading */
            margin-bottom: 0.8rem; /* Reduced margin */
            color: var(--primary); /* Use primary color */
            font-weight: 600;
        }

        .value-card p {
            color: #bbb; /* Lighter text color */
            font-size: 0.95rem;
        }

        /* Deities Section */
        .deities {
            padding: 5rem 5%;
            background: #1a1a2e; /* Different background for contrast */
            position: relative;
        }

        .deities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); /* Adjusted minmax */
            gap: 2.5rem; /* Reduced gap */
            margin-top: 3rem;
        }

        .deity-card {
            background: var(--card-bg);
            border-radius: 15px; /* Consistent rounding */
            padding: 2.5rem;
            text-align: center;
            transition: all 0.5s ease-in-out;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .deity-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(147, 112, 219, 0.1) 0%, transparent 70%);
            animation: rotate 18s linear infinite reverse; /* Reverse rotation */
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .deity-card:hover::before {
            opacity: 1;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .deity-card:hover {
            transform: translateY(-12px) scale(1.03); /* Adjusted hover effect */
            box-shadow: 0 20px 50px rgba(147, 112, 219, 0.3);
            border-color: var(--accent);
        }

        .deity-image {
            width: 120px; /* Smaller image */
            height: 120px;
            background: var(--gradient-main);
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem; /* Adjusted font size */
            position: relative;
            z-index: 1;
            box-shadow: 0 5px 20px rgba(30, 144, 255, 0.4);
            transition: transform 0.4s ease;
        }

        .deity-card:hover .deity-image {
            transform: scale(1.1);
        }

        .deity-card h3 {
            font-size: 1.6rem; /* Adjusted heading size */
            color: var(--light);
            margin-bottom: 0.8rem;
            font-weight: 700;
        }

        .deity-card p {
            color: #ccc; /* Lighter text color */
            line-height: 1.6;
            font-size: 1rem;
        }

        /* Activities Section */
        .activities {
            padding: 5rem 5%;
            background: var(--dark);
            position: relative;
        }

         .activities::before {
             content: '';
             position: absolute;
             top: 0;
             left: 0;
             width: 100%;
             height: 100%;
              background: url('data:image/svg+xml,%3Csvg width="6" height="6" viewBox="0 0 6 6" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="%23ffffff" fill-opacity="0.02" fill-rule="evenodd"%3E%3Cpath d="M5 0h1L0 6V5zm2 2h-1L0 8V7zM2 0h2v2H2V0zm2 4h2v2h-2V4zm1 0h1L0 6V5zm-2 2h2v2h-2V6zm3-2h2v2h-2V4zM0 0h2v2H0V0zm0 4h2v2H0V4z"%3E%3C/path%3E%3C/g%3E%3C/svg%3E');
             z-index: 0;
         }


        .activities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); /* Adjusted minmax */
            gap: 1.5rem; /* Reduced gap */
            margin-top: 3rem;
        }

        .activity-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px; /* Consistent rounding */
            padding: 1.5rem;
            transition: all 0.4s ease-in-out;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        }

        .activity-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 5px; /* Subtle underline effect */
            background: var(--gradient-main);
            transform: scaleX(0);
            transform-origin: bottom right;
            transition: transform 0.4s ease-in-out;
        }

        .activity-card:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }


        .activity-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(30, 144, 255, 0.3);
            border-color: rgba(240, 240, 240, 0.2);
        }

        .activity-icon {
            width: 50px; /* Smaller icon */
            height: 50px;
            background: var(--gradient-main);
            border-radius: 10px; /* Less rounded */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem; /* Adjusted font size */
            margin-bottom: 1rem;
            box-shadow: 0 3px 10px rgba(30, 144, 255, 0.2);
            transition: transform 0.3s ease;
        }

        .activity-card:hover .activity-icon {
            transform: scale(1.1);
        }

        .activity-card h4 {
            color: var(--light); /* Use light color */
            margin-bottom: 0.5rem;
            font-size: 1.1rem; /* Adjusted size */
            font-weight: 600;
        }

        .activity-card p {
            color: #ccc; /* Lighter text color */
            font-size: 0.9rem; /* Slightly smaller */
            line-height: 1.5;
        }

        /* Community Groups */
        .groups {
            padding: 5rem 5%;
            background: #1a1a2e; /* Consistent background */
        }

        .groups-container {
            margin-top: 3rem;
        }

        .group-category {
            margin-bottom: 2.5rem; /* Reduced margin */
        }

        .group-category h3 {
            color: var(--secondary); /* Use secondary color */
            font-size: 1.4rem; /* Adjusted size */
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid rgba(255, 99, 71, 0.3); /* Adjusted border color */
             font-weight: 700;
        }

        .group-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem; /* Reduced gap */
        }

        .group-tag {
            background: rgba(147, 112, 219, 0.15); /* Adjusted transparency */
            border: 1px solid rgba(147, 112, 219, 0.3); /* Adjusted border */
            padding: 0.4rem 1.2rem; /* Adjusted padding */
            border-radius: 20px; /* More rounded */
            color: var(--light);
            transition: all 0.3s ease-in-out;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .group-tag:hover {
            background: rgba(147, 112, 219, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(147, 112, 219, 0.3);
        }

        /* Social Initiatives */
        .initiatives {
            padding: 5rem 5%;
            background: var(--dark);
            position: relative;
        }

         .initiatives::before {
             content: '';
             position: absolute;
             top: 0;
             left: 0;
             width: 100%;
             height: 100%;
             background: url('data:image/svg+xml,%3Csvg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="%23ffffff" fill-opacity="0.04" fill-rule="evenodd"%3E%3Cpath d="M0 40L40 0H20L0 20V40zm10 0L40 10V0h-10L0 30v10zm10 0L40 20V0h-10L10 30v10zm10 0L40 30V0h-10L20 30v10zm10 0L40 40V0h-10L30 30v10z"/%3E%3C/g%3E%3C/svg%3E') repeat;
             z-index: 0;
         }


        .initiatives-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); /* Adjusted minmax */
            gap: 2.5rem; /* Reduced gap */
            margin-top: 3rem;
        }

        .initiative-card {
            background: var(--card-bg);
            border-radius: 15px; /* Consistent rounding */
            overflow: hidden;
            transition: all 0.4s ease-in-out;
            cursor: pointer;
            border: 1px solid var(--border-color);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .initiative-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(255, 99, 71, 0.3); /* Adjusted shadow color */
            border-color: rgba(255, 99, 71, 0.4);
        }

        .initiative-header {
            background: linear-gradient(90deg, var(--secondary), var(--primary)); /* Gradient header */
            padding: 1.5rem; /* Reduced padding */
            text-align: center;
             color: white;
        }

        .initiative-header h3 {
            font-size: 1.6rem; /* Adjusted size */
            color: white; /* White text on gradient */
            margin-bottom: 0; /* Removed margin */
             font-weight: 700;
        }

        .initiative-content {
            padding: 2rem;
        }

        .initiative-content p {
            color: #ccc; /* Lighter text */
            line-height: 1.6;
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .initiative-quote {
            font-style: italic;
            color: var(--accent); /* Use accent color */
            padding: 1rem;
            border-left: 3px solid var(--accent); /* Adjusted border color */
            background: rgba(147, 112, 219, 0.1); /* Adjusted background */
            margin-top: 1.5rem;
             border-radius: 0 10px 10px 0;
        }

        /* Contact Section */
        .contact {
            padding: 5rem 5%;
            background: #1a1a2e; /* Consistent background */
            text-align: center;
        }

        .contact-content {
            max-width: 900px; /* Slightly wider */
            margin: 3rem auto;
        }

        .contact-content p {
            font-size: 1.1rem; /* Adjusted size */
            margin-bottom: 2rem;
            color: #ccc;
        }


        .contact-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); /* Adjusted minmax */
            gap: 1.5rem; /* Reduced gap */
            margin-bottom: 3rem;
        }

        .contact-item {
            background: var(--card-bg);
            padding: 2rem 1.5rem; /* Adjusted padding */
            border-radius: 15px; /* Consistent rounding */
            transition: all 0.4s ease-in-out;
            border: 1px solid var(--border-color);
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        }

        .contact-item:hover {
            background: rgba(30, 30, 30, 0.9); /* Darker on hover */
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(30, 144, 255, 0.3);
            border-color: rgba(240, 240
